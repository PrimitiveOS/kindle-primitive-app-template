[workspace]
resolver = "2"
members = ["crates/hello-core", "crates/hello-render", "crates/hello-kindle", "crates/hello-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
hello-core = { path = "crates/hello-core" }
hello-render = { path = "crates/hello-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

[profile.release]
lto = true
codegen-units = 1
